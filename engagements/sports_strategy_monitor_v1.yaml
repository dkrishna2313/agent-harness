engagement:
  title: Sports Strategy
  client: Deloitte Sports & Major Events
  industry: Sports Consulting / Sports Technology / Major Events
  current_situation: 'Deloitte already has a significant position in the sports market
    through existing  major-events work, as well as ConvergeSports. The business now
    needs a clear strategy to grow in a non-linear way, preferably to get to 4-6%
    of the addressable market.  The strategy should identify which buyer segments
    Deloitte should prioritize, which services  and offers have the strongest commercial
    potential, where Deloitte has a differentiated  right-to-win, and whether growth
    should be driven through advisory-led, platform-enabled,  governing-body-led,
    investment-led, or hybrid approaches.

    '
  objectives:
  - Develop an executive-ready strategy for how Deloitte Global Sustainability & Infrastructure
    can incubate, commercialize, and scale a sports growth topic through the SGO.
  - Recommend whether Deloitte should launch a focused Sports Intelligence & Advisory
    growth play, clarify the first buyer segments and offers
  - Define the sports market by buyer segment, geography, sport, and subsegment.
  - Size the professional-services opportunity by market and by geography.
  - Identify those services that are fast-growing and have a potential to generate
    large revenues.
  - Identify the services Deloitte should own most strongly in this market.
  - Compare Deloitte against major firms and boutiques active in sports.
  - Define the client value proposition in operational savings and revenue growth.
  - Identify the partner ecosystem needed to deliver a complete offer.
  - Clarify why Deloitte should be the preferred firm for sports clients.
  - Develop a go-to-market view for becoming the number 1 choice in the space.
  - Capture evidence gaps and assumptions that must be validated before finalization.
  - Determine whether Deloitte should win through a platform-led model, a governing-body-led
    model or some other approach.
  - Prioritize 2-3 buyer segments rather than treating all buyers equally.
  - Define offer
  - Distinguish market attractiveness from Deloitte's right-to-win.
  - Define Deloitte's primary commercial wedge.
  - Map the opportunity to SGO services and explain why the SGO is the right incubation
    model.
  - Create a practical 90-day validation roadmap with scale, stop, and pivot criteria.
  constraints:
  - The strategy must reflect that Deloitte is already in the market, not entering
    from zero.
  - The tone must be concise, direct, and natural, without consulting jargon.
  - The 'How we win' section should remain light until pipeline and target-account
    data are available.
  - Recommendations must be grounded in the uploaded internal decks and external evidence.
  - Market sizing should focus on consulting and technology implementation spend.
  - The output should remain suitable for a CEO-level strategy document.
  stakeholders:
  - Stacy Janiak, Deputy CEO
  - Jennifer Steinmann, Global Leader, Sustainability & Infrastructure
  - Deloitte Global Sustainability & Infrastructure leadership
  - SGO leadership
  - Deloitte CEO / firm leadership
  - Sports and Major Events leadership
  - Sports product leadership
  - Strategy / growth leadership
  - Industry alliance leadership
  - Sales and business development leadership
  - Technology / delivery leadership
  - Partners supporting sports, venue, cyber, data, and digital work
  assumptions:
  - The sports market is fragmented and multi-buyer, with different economics by segment.
  - Consulting demand exists across growth, operations, digital, cyber, and build-related
    work.
  - Deloitte can compete on breadth, credibility, and delivery scale if the offer
    is focused.
  - Internal Deloitte sports credentials are a meaningful source of differentiation.
  - Deloitte's Multi-Disciplinary Model (MDM) provides meaningful differentiation
    in the marketplace because of its ability to deliver services in infrastructure,
    tax, incentives, regulations and consulting
  - Partnerships will remain necessary to deliver a complete solution in this market.
  - The competitive set includes both large global firms and smaller specialist boutiques.
  - External market conditions, partner ecosystems, and deal pipelines will change
    over time.
  - Sports buyers have demonstrated willingness to purchase advisory and professional
    services, but it remains uncertain whether they will adopt recurring managed services
    at the scale required to support a platform-enabled growth model.
  - Clients will share enough data to make the platform useful
  - Benchmark products will create value
  - Partnership access will not block adoption.
  success_criteria:
  - Produce a clear market definition with subsegments and geographic priorities.
  - Rank the most valuable services and identify Deloitte's priority plays.
  - Show how Deloitte differs from competitors in a credible, evidence-backed way.
  - Explain the client value in practical business terms.
  - Define the partnerships required to deliver the offer.
  - Make a strong case for why Deloitte should win more often in the market.
  - Provide a practical go-to-market direction once pipeline data is added.
  - Keep the strategy concise, readable, and usable by leadership.
  - The strategy should read as an investment thesis rather than a market assessment.
  - Clearly answer the following questions - What is the size of the prize? Who is
    the buyer? What is the commercial wedge? Why Deloitte? Why SGO? What happens next?
  - Define 2-3 repeatable offers with clear buyer, value proposition, proof points,
    and revenue pathways.
  - Demonstrate commercial viability, differentiation, repeatability, scalability,
    and defensibility.
  decision_horizon: 2026–2027 strategy formation; FY27 go-to-market planning; 3–5
    year growth horizon
  priorities:
  - Market definition and subsegment clarity
  - Service-line focus and portfolio shaping
  - Competitive differentiation
  - Client value proposition
  - Partner ecosystem design
  - Deloitte credibility and proof points
  - Go-to-market sequencing
  - Account prioritization once deal data is available
  - TAM, SAM, and SOM estimation and market-share scenarios.
  - Buyer segment prioritization.
  - Commercial offer definition.
  - Deloitte right-to-win assessment.
  - SGO service mapping and activation model.
  - ConvergeSports readiness assessment.
  - Revenue, margin, repeatability, and pull-through economics.
  - Target-account and journey-client identification.
  risks:
  - The strategy becoming too broad and trying to cover every sports subsegment equally.
  - Overlapping with existing Deloitte assets without creating a sharper market position.
  - Overstating market size or client value without enough evidence.
  - Building a strategy that is too dependent on partnerships without clear ownership.
  - Delaying execution by waiting too long for perfect data.
  - Producing a document that feels like generic consulting language rather than a
    clear point of view.
  - Platform adoption risk
  - Data-sharing resistance
  - Over-indexing on a platform-led recommendation before platform readiness and market
    demand are validated.
  - Failure to identify a differentiated commercial wedge.
  - Inability to convert governing-body credentials into broader commercial growth.
  - Producing a strategy that is analytically correct but not compelling to executive
    decision makers.
  - Assuming recurring revenue without sufficient evidence of buyer demand.
  known_unknowns:
  - The exact total addressable market for sports consulting by geography.
  - The relative spend across fan growth, operations, digital, cyber, and build-related
    services.
  - Which competitor firms are winning the most valuable deals today.
  - Which internal Deloitte sports references are strongest for the final strategy.
  - The available pipeline and target-account data for the go-to-market section.
  - The partner ecosystem Deloitte should prioritize in each subsegment.
  - The most attractive buyer segments for near-term expansion.
  - The best way to quantify client value without including resale of a standalone
    digital asset.
  - Switching-cost uncertainty
  - Benchmark monetization
  - Whether recurring revenue can be demonstrated in this market.
  - ConvergeSports product maturity and commercial readiness.
  - Buyer willingness to pay premium Deloitte fees versus specialist firms.
  - Conversion rates from governing-body credentials into commercial revenue opportunities.
  - The most commercially attractive first-wave buyer segments.
  - The most commercially attractive first-wave offers.
  - Which SGO services create the strongest acceleration effect.
  - Whether advisory-led, platform-enabled, or hybrid approaches create the strongest
    commercial outcome.
  - The most effective scale, stop, or pivot criteria for FY27 investment decisions.
strategy:
  enabled: true
  config_version: ph12.2a-v1
  version: '1.0'
  framework: monitor_choice_cascade
  metadata:
    author: Deloitte Sports & Major Events strategy team
    engagement_id: sports-strategy-monitor-v1
    notes: 'Applies the Monitor Deloitte choice cascade through five configured strategic
      dimensions: Winning Aspiration, Where to Play, How to Win, Must-Have Capabilities,
      and Management Systems. The framework name is carried into the plan and trace;
      the configured dimensions make the cascade operational.

      '
  objectives:
    primary:
    - Select one coherent, evidence-backed strategy for nonlinear growth in sports.
    - Define a complete and mutually reinforcing Monitor Deloitte choice cascade.
    - Prioritize two to three buyer segments and two to three repeatable offers.
    - Identify Deloitte's differentiated commercial wedge and right to win.
    - Define the capabilities and management systems required to execute the strategy.
    secondary:
    - Compare advisory-led, platform-enabled, governing-body-led, investment-led,
      and hybrid postures.
    - Establish a practical 90-day validation roadmap with scale, stop, and pivot
      criteria.
    - Surface evidence gaps, assumptions, risks, and unresolved strategic choices.
  dimension_configs:
  - id: winning_aspiration
    title: Winning Aspiration
    description: 'The distinctive position Deloitte seeks to hold in the sports market
      and the business outcome that defines success over the three-to-five-year horizon.

      '
    required: true
    choices:
    - id: category_leader_sports_intelligence
      title: Category leader in Sports Intelligence & Advisory
      description: 'Become the preferred global advisor for data-enabled growth, operating
        transformation, and investment decisions across priority sports buyers.

        '
      execution_complexity: medium
    - id: scaled_sports_transformation_platform
      title: Scaled sports transformation platform
      description: 'Build a platform-enabled services business combining advisory,
        technology implementation, managed capabilities, and reusable intelligence
        assets.

        '
      execution_complexity: high
    - id: major_events_to_commercial_growth
      title: Convert major-events leadership into commercial growth
      description: 'Use major-events and governing-body credentials as the wedge into
        broader, repeatable commercial work with leagues, teams, venues, and investors.

        '
      execution_complexity: low
    - id: focused_high_margin_growth_play
      title: Focused high-margin growth play
      description: 'Build a selective portfolio of repeatable offers capable of reaching
        a meaningful share of addressable consulting and technology spend.

        '
      execution_complexity: low
  - id: where_to_play
    title: Where to Play
    description: 'The buyer segments, offers, geographies, and sports subsegments
      Deloitte will prioritize, together with the areas it will deliberately deprioritize.

      '
    required: true
    choices:
    - id: leagues_governing_bodies_major_events
      title: Leagues, governing bodies, and major events
      description: 'Prioritize global and national governing bodies, leagues, and
        major-event organizers in North America and selected global event corridors.

        '
      execution_complexity: low
    - id: teams_clubs_venues
      title: Teams, clubs, and venues
      description: 'Prioritize professional teams, clubs, venue operators, and stadium
        owners with growth, modernization, cyber, data, and operating-model needs.

        '
      execution_complexity: medium
    - id: investors_rights_holders_sports_tech
      title: Investors, rights holders, and sports technology firms
      description: 'Prioritize private capital, strategic investors, media and rights
        holders, and sports technology companies pursuing diligence, growth, and scale.

        '
      execution_complexity: medium
    - id: concentrated_multi_buyer_portfolio
      title: Concentrated multi-buyer portfolio
      description: 'Select two to three buyer segments and two to three repeatable
        offers based on market attractiveness, Deloitte right to win, and near-term
        pipeline.

        '
      execution_complexity: high
  - id: how_to_win
    title: How to Win
    description: 'The differentiated commercial wedge and delivery model Deloitte
      will use to outperform global firms and specialist sports boutiques.

      '
    required: true
    choices:
    - id: advisory_led
      title: Advisory-led
      description: 'Lead with senior strategic advisory and use technology, tax, infrastructure,
        cyber, and implementation capabilities as pull-through services.

        '
      execution_complexity: low
    - id: platform_enabled
      title: Platform-enabled
      description: 'Combine advisory with reusable data, benchmarking, workflow, and
        managed capabilities where buyer demand and product readiness are proven.

        '
      execution_complexity: high
    - id: governing_body_led
      title: Governing-body-led
      description: 'Use governing-body and major-event credentials to create repeatable
        entry points into adjacent commercial buyers and services.

        '
      execution_complexity: medium
    - id: investment_led
      title: Investment-led
      description: 'Lead with investor, transaction, infrastructure, and portfolio-value-creation
        needs to build a sports growth franchise.

        '
      execution_complexity: medium
    - id: hybrid
      title: Hybrid
      description: 'Use focused advisory offers as the commercial wedge, selectively
        enable them with platforms and partnerships, and expand through governing-body
        credibility.

        '
      execution_complexity: high
  - id: must_have_capabilities
    title: Must-Have Capabilities
    description: 'The capabilities Deloitte must own, strengthen, build, or access
      through partners to execute the selected Where-to-Play and How-to-Win choices.

      '
    required: true
    choices:
    - id: advisory_and_industry_credibility
      title: Advisory and industry credibility
      description: 'Senior sports expertise, market insight, buyer access, account
        leadership, commercial strategy, and operating-model capability.

        '
      execution_complexity: low
    - id: data_platform_and_product
      title: Data, platform, and product capability
      description: 'Sports data architecture, benchmarking, analytics, product management,
        platform engineering, cyber, privacy, and managed-service delivery.

        '
      execution_complexity: high
    - id: major_events_and_infrastructure
      title: Major events and infrastructure capability
      description: 'Venue and event transformation, infrastructure, sustainability,
        incentives, regulation, tax, capital programs, and delivery assurance.

        '
      execution_complexity: medium
    - id: integrated_mdm_ecosystem
      title: Integrated MDM and ecosystem capability
      description: 'A coordinated multi-disciplinary model with repeatable offers,
        alliance partners, commercial ownership, and cross-border delivery capacity.

        '
      execution_complexity: high
  - id: management_systems
    title: Management Systems
    description: 'The governance, metrics, incentives, investment gates, and operating
      mechanisms required to sustain execution and make scale, stop, or pivot decisions.

      '
    required: true
    choices:
    - id: sgo_incubation_gates
      title: SGO incubation with explicit investment gates
      description: 'Use a 90-day validation cycle, named executive sponsorship, staged
        funding, and explicit scale, stop, and pivot criteria.

        '
      execution_complexity: low
    - id: offer_pnl_and_pipeline_governance
      title: Offer P&L and pipeline governance
      description: 'Track qualified pipeline, win rate, price realization, delivery
        margin, repeat revenue, cross-service pull-through, and referenceability by
        offer.

        '
      execution_complexity: medium
    - id: account_and_ecosystem_operating_rhythm
      title: Account and ecosystem operating rhythm
      description: 'Establish target-account ownership, partner governance, pursuit
        reviews, capability roadmaps, and quarterly portfolio decisions.

        '
      execution_complexity: medium
    - id: integrated_growth_management_system
      title: Integrated growth management system
      description: 'Combine incubation gates, offer economics, account governance,
        capability ownership, and evidence-based portfolio reallocation.

        '
      execution_complexity: high
  generation:
    max_candidates: 4
    diversity_required: true
  evaluation:
    method: multi_criteria
    min_score_threshold: 0.7
  evaluation_config:
    weight_policy: strict
    score_precision: 6
    minimum_winner_margin: 0.05
    saturation_threshold: 0.95
    saturation_spread_threshold: 0.02
    tie_tolerance: 1.0e-06
    criteria:
      strategic_fit:
        weight: 0.16
        enabled: true
      execution_feasibility:
        weight: 0.14
        enabled: true
      evidence_quality:
        weight: 0.12
        enabled: true
      opportunity_capture:
        weight: 0.12
        enabled: true
      risk_resilience:
        weight: 0.1
        enabled: true
      assumption_robustness:
        weight: 0.1
        enabled: true
      choice_completeness:
        weight: 0.08
        enabled: true
      mechanism_defined:
        weight: 0.06
        enabled: true
      position_articulated:
        weight: 0.05
        enabled: true
      option_identified:
        weight: 0.04
        enabled: true
      risk_awareness:
        weight: 0.02
        enabled: true
      assumption_coverage:
        weight: 0.01
        enabled: true
  constraints:
    excluded_options: []
    required_conditions:
    - Prioritize no more than three first-wave buyer segments.
    - Define two to three repeatable offers with clear buyers, pain points, value
      propositions, proof points, and revenue pathways.
    - Treat Deloitte as an established participant in sports rather than a new market
      entrant.
    - Distinguish market attractiveness from Deloitte's right to win.
    - Ground recommendations in internal credentials and external evidence.
    - Do not assume recurring managed-services revenue without evidence of buyer demand
      and willingness to pay.
    - Do not recommend a broad all-segment strategy that treats every sports buyer
      equally.
    - Do not recommend a pure software-product strategy without an integrated services
      thesis.
    - Do not recommend an acquisition-led strategy as the primary path to growth.
    - Do not recommend a large capital commitment before commercial validation.
    - Include a practical 90-day validation roadmap with explicit scale, stop, and
      pivot criteria.
    - Keep the output suitable for CEO and board-level decision making.
  constraint_config:
    required_violation_policy: penalize
    default_required_penalty: 0.25
    default_preferred_penalty: 0.1
    maximum_total_penalty: 0.5
    fail_on_unknown_constraint_reference: false
    include_constraint_rationale_in_report: true
  validation:
    require_evidence: true
    min_confidence: ''
    require_assumptions: true
  mapping_config:
    enabled: true
    unresolved_policy: preserve_upstream
    authority:
      single_pass: true
      fail_on_mapping_mismatch: true
      allow_content_resolution_remap: false
    confidence:
      minimum_authoritative_score: 0.2
      minimum_authoritative_margin: 0.05
      high_score_threshold: 0.4
      high_margin_threshold: 0.15
      disallow_high_with_contradiction: true
    posture_weights:
      geographic: 0.3
      power: 0.35
      timing: 0.35
    contradiction_penalties:
      geographic_hard: 0.35
      geographic_soft: 0.12
      power_hard: 0.3
      power_soft: 0.1
      timing_hard: 0.2
      timing_soft: 0.1
    generic_overlap:
      per_match_weight: 0.01
      maximum_bonus: 0.1
  alignment_config:
    enabled: true
    minimum_challenge_margin: 0.1
    minimum_challenge_confidence: Medium
    same_option_high_confidence_status: confirmed
    same_option_medium_confidence_status: refined
    different_option_below_margin_status: unresolved
    low_mapping_confidence_status: unresolved
    unresolved_authority: upstream_preferred
  content:
    minimum_relevance_score: 0.2
    maximum_assumptions_per_theory: 5
    maximum_risks_per_theory: 5
    maximum_opportunities_per_theory: 5
    maximum_recommendations_per_theory: 5
    maximum_evidence_per_theory: 12
    allow_symmetric_fallback: true
    minimum_content_coverage: 0.5
    minimum_distinctive_coverage: 0.2
    minimum_discrimination_score: 0.2
    maximum_shared_assumptions: 5
    maximum_shared_risks: 5
    maximum_shared_opportunities: 5
    maximum_shared_recommendations: 5
    maximum_shared_evidence: 12
    partial_homogenization_threshold: 0.75
    full_homogenization_threshold: 0.95
    maximum_identical_dimensions: 2
    relationship_priorities:
      explicit_option_link: 1.0
      explicit_recommendation_link: 0.8
      explicit_assumption_risk_link: 0.7
      direct_posture_match: 0.5
      compatible_posture_match: 0.25
      category_match: 0.15
      semantic_overlap: 0.05
      posture_contradiction: -0.5
    discrimination:
      unique_theory_score: 1.0
      subset_shared_score: 0.5
      global_shared_score: 0.0
      shared_context_multiplier: 0.35
      distinctive_content_multiplier: 1.0
      evidence_inherits_lineage: true
    coverage_policy:
      sufficient_threshold: 0.75
      partial_threshold: 0.5
      fallback_heavy_threshold: 0.25
    confidence_policy:
      high_minimum_distinctive_share: 0.4
      high_minimum_evidence_share: 0.3
      high_maximum_shared_share: 0.6
      high_maximum_fallback_share: 0.1
      medium_minimum_distinctive_share: 0.2
      medium_minimum_evidence_share: 0.2
      medium_maximum_fallback_share: 0.35
      cap_at_medium_on_partial_homogenization: false
      cap_at_low_on_substantial_homogenization: false
      require_authoritative_mapping_for_high: true
    homogenization_policy:
      enabled: true
      partial_threshold: 0.75
      substantial_threshold: 0.9
      full_threshold: 0.99
      maximum_identical_dimensions_before_partial: 2
      material_dimensions:
      - assumptions
      - risks
      - opportunities
      - recommendations
      - evidence
      - success_conditions
      allow_relationship_based_justification: true
      emit_report_warning: true
    fallback_policy:
      enabled: true
      allowed_content_types:
      - assumptions
      - risks
      - opportunities
      - recommendations
      - evidence
      - success_conditions
      maximum_fallback_share: 0.4
      confidence_penalty: 0.2
      report_fallback_usage: true
      fail_above_maximum_share: false
  reporting_config:
    enabled: true
    authority:
      show_upstream_preferred_option: false
      show_mapped_option: false
      show_alignment_status: true
      show_selection_status: true
      show_scores: true
      show_mapping_confidence: true
      show_saturation_status: true
    content:
      show_why_strategy_won: true
      show_linked_recommendations: true
      show_key_assumptions: true
      show_primary_risks: true
      show_opportunities: true
      show_success_conditions: true
      show_theory_specific_evidence: true
      show_shared_context: true
      show_content_coverage: true
      show_distinctive_coverage: true
      show_content_confidence: true
      show_homogenization_status: true
      show_alternative_differentiation: true
    mandatory:
      challenged_alignment: true
      unresolved_alignment: true
      low_mapping_confidence: true
      saturation: true
      substantial_homogenization: true
      excessive_fallback: true
      insufficient_coverage: true
    limits:
      maximum_assumptions: 5
      maximum_risks: 5
      maximum_opportunities: 5
      maximum_evidence: 12
      maximum_success_conditions: 8
      maximum_alternatives: 4
      sentence_limit: 300
  diagnostics_config:
    unknown_reference: warning
    mapping_mismatch: error
    invalid_weight_sum: error
    low_mapping_confidence: warning
    partial_homogenization: warning
    substantial_homogenization: warning
    fallback_heavy: warning
    insufficient_coverage: warning
    missing_report_section: warning
