[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-layer"
version = "0.1.0"
description = "Knowledge base builder and retrieval layer for AI research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.39.0",
    "pydantic>=2.8.0",
    "pypdf>=4.3.0",
    "pyyaml>=6.0",
    "typer>=0.12.5",
    # K1.0 – optional web retrieval (all soft deps; guarded in web_search.py)
    "ddgs>=9.0",
    "requests>=2.31",
    "trafilatura>=1.9",
    # MCP server
    "mcp>=2.0",
    "google-genai>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]
knowledge = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[project.scripts]
knowledge-mcp = "knowledge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
